<body>
<div class="fund_overview2 historical_worth2">
	<div class="block">
		<div class="con clearfix">
			<div class="l j-l">
				<div class="list2">
					<div class="tit">分红情况</div>
					<div class="liner3 border">
						<form id="queryForm" name="queryForm" action="fundLishifenhong.do" method="post">
							<input name="fundcode" type="hidden" value="005698">
						</form>
								<div class="t_head middle-box">
									<table class="table-head middle-cont" id="hoverBox1">
										<thead>
										<tr>
											<th><span class="s1">年份</span></th>
											<th><span class="s1">权益登记日</span></th>
											<th><span class="s1">每份分红（元）</span></th>
											<th><span class="s1">分红发放日</span></th>
										</tr>
										</thead>

								<div class="t_cont">

					<!-- 分页 -->
					<div class="page-mod">
						<ul class="page-box p-show clearfix">
							<li class="page-item prev page-arrow">
								<a id="prev" href="javascript:void(0);" onclick="upPage();"></a>
							</li>
							<li  class="page-item"><a href="javascript:void(0)"  class="cur"  onclick="thisPage(1)" >1</a> </li>
							<li class="page-item next page-arrow">
								<a id="next" href="javascript:void(0)" onclick="nextPage();"></a>
							</li>
							<li class="page-item jump">
								<a class="clearfix">
									<div class="page-input"><input type="text" id="goNum"></div>
									<button type="submit" class="page-btn" onclick="goPage()">GO</button>
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	window.onload = function() {
		let totalPage = '1';
		let currentPage = '1';
		let next = document.querySelector("#next");
		if (totalPage == currentPage) {
			next.style.cursor = "no-drop";
			next.style.opacity = 0.5;
		} else {
			next.style.cursor = "pointer";
			next.style.opacity = 1;
		}
		let prev = document.querySelector("#prev");
		if (currentPage == 1) {
			prev.style.cursor = "no-drop";
			prev.style.opacity = 0.5;
		} else {
			prev.style.cursor = "pointer";
			prev.style.opacity = 1;
		}
	}
</script>
<script type="text/javascript">
	//下一页
	function nextPage(){
		let totalPage = '1';
		let currentPage = '1';
		if (totalPage != currentPage) {
			var hidden = "<input type='hidden' name='pageIndex' value='2' />";
			$("#queryForm").append(hidden).submit();
		}
	}

	//上一页
	function upPage(){
		let currentPage = '1';
		if (currentPage != 1) {
			var hidden = "<input type='hidden' name='pageIndex' value='0' />";
			$("#queryForm").append(hidden).submit();
		}
	}

	//点击当前页
	function thisPage(num){
		var hidden = "<input type='hidden' name='pageIndex' value='"+num+"' />";
		$("#queryForm").append(hidden).submit();
	}

	//点击当前页
	function goPage(){
		var goNum=$("#goNum").val();
		let totalPage = '1';
		if (goNum > totalPage) {
			return;
		}
		var hidden = "<input type='hidden' name='pageIndex' value='"+goNum+"' />";
		$("#queryForm").append(hidden).submit();
	}

</script>
</body>
